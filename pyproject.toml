[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sublet"
version = "0.2.0"
description = "Lend GPU memory, offload only what's needed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]  # torch reads __cuda_array_interface__ through numpy

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sublet = ["*.h", "*.c"]

[tool.ruff]
line-length = 119
